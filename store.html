<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPDOG - Boutique VIP</title>
    <style>
        body {
            background-color: #050505; color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em; font-style: italic; margin-bottom: 5px;
            background: linear-gradient(45deg, #ffd700, #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .wallet-box {
            background: #111; padding: 10px 20px; border-radius: 50px;
            display: inline-block; border: 1px solid #333; margin-bottom: 30px;
            font-family: monospace; font-size: 1.5em; color: #2ecc71;
        }
        .section-title {
            text-align: left; margin-top: 40px; margin-bottom: 15px;
            font-size: 1.2em; color: #888; text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .store-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;
        }
        .item-card {
            background: #111; border: 1px solid #333; border-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; align-items: center;
            transition: 0.2s; position: relative;
        }
        .item-preview {
            width: 60px; height: 60px; border-radius: 10px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .item-name { font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        .item-desc { font-size: 0.7em; color: #666; margin-bottom: 10px; min-height: 30px; }
        .item-price { color: #f1c40f; font-size: 0.9em; margin-bottom: 10px; }
        
        .btn-action {
            background: #2ecc71; color: #000; border: none; padding: 8px 0;
            width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        .btn-action.owned { background: #3498db; color: #fff; }
        .btn-action.active { background: #555; color: #aaa; cursor: default; }
        .btn-action.locked { background: #333; color: #555; cursor: not-allowed; }

        .back-btn {
            display: block; margin: 40px auto; padding: 15px 30px;
            background: transparent; border: 1px solid #fff; color: #fff;
            text-decoration: none; border-radius: 50px; width: 200px;
        }
    </style>
</head>
<body>

    <h1>BOUTIQUE VIP</h1>
    <div class="wallet-box" id="wallet-display">Chargement...</div>

    <div class="section-title">🎨 AMBIANCES VISUELLES</div>
    <div class="store-grid" id="skin-grid"></div>

    <div class="section-title">🐕 MEUTES DE COMBAT</div>
    <div class="store-grid" id="dog-grid"></div>

    <a href="index.html" class="back-btn">RETOUR ACCUEIL</a>

    <script src="catalog.js?v=2"></script>

    <script>
        const wallet = parseInt(localStorage.getItem('topdog_wallet')) || 0;
        let inventory = JSON.parse(localStorage.getItem('topdog_inventory')) || ['bg_default', 'dog_default'];
        
        let activeBg = localStorage.getItem('topdog_active_bg') || 'bg_default';
        let activeDog = localStorage.getItem('topdog_active_dog') || 'dog_default';

        document.getElementById('wallet-display').innerText = new Intl.NumberFormat('fr-FR').format(wallet) + " $";

        function renderStore() {
            const skinContainer = document.getElementById('skin-grid');
            const dogContainer = document.getElementById('dog-grid');
            skinContainer.innerHTML = '';
            dogContainer.innerHTML = '';

            if(typeof CATALOG !== 'undefined') {
                CATALOG.skins.forEach(item => createCard(item, skinContainer, activeBg, 'bg'));
                CATALOG.dogs.forEach(item => createCard(item, dogContainer, activeDog, 'dog'));
            }
        }

        function createCard(item, container, currentActive, type) {
            const el = document.createElement('div');
            el.className = 'item-card';
            
            const isOwned = inventory.includes(item.id);
            const isActive = currentActive === item.id;
            const canBuy = wallet >= item.price;

            let previewStyle = type === 'bg' ? `background: ${item.color};` : `background: #222; color: #fff;`;
            let content = type === 'dog' ? item.emoji : '';

            let btnText, btnClass, action;

            if (isActive) {
                btnText = "ACTIF"; btnClass = "btn-action active"; action = null;
            } else if (isOwned) {
                btnText = "ÉQUIPER"; btnClass = "btn-action owned";
                action = () => equipItem(item.id, type);
            } else if (canBuy) {
                btnText = `ACHETER ${formatPrice(item.price)}`; btnClass = "btn-action";
                action = () => buyItem(item, type);
            } else {
                btnText = `ACHETER ${formatPrice(item.price)}`; btnClass = "btn-action locked"; action = null;
            }

            el.innerHTML = `
                <div class="item-preview" style="${previewStyle}">${content}</div>
                <div class="item-name">${item.name}</div>
                <div class="item-desc">${item.desc || ''}</div>
                ${!isOwned ? `<div class="item-price">${formatPrice(item.price)}</div>` : ''}
            `;

            const btn = document.createElement('button');
            btn.className = btnClass;
            btn.innerText = btnText;
            if (action) btn.onclick = action;
            
            el.appendChild(btn);
            container.appendChild(el);
        }

        function buyItem(item, type) {
            if (!confirm(`Acheter ${item.name} pour ${formatPrice(item.price)} ?`)) return;
            localStorage.setItem('topdog_wallet', wallet - item.price);
            inventory.push(item.id);
            localStorage.setItem('topdog_inventory', JSON.stringify(inventory));
            equipItem(item.id, type);
        }

        function equipItem(id, type) {
            if (type === 'bg') localStorage.setItem('topdog_active_bg', id);
            else localStorage.setItem('topdog_active_dog', id);
            location.reload();
        }

        function formatPrice(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(0) + 'G';
            if (num >= 1000000) return (num / 1000000).toFixed(0) + 'M';
            return num + ' $';
        }

        renderStore();
    </script>
</body>
</html>
