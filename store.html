<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPDOG - Boutique VIP</title>
    <style>
        body {
            background-color: #050505; color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em; font-style: italic; margin-bottom: 5px;
            background: linear-gradient(45deg, #ffd700, #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .wallet-box {
            background: #111; padding: 10px 20px; border-radius: 50px;
            display: inline-block; border: 1px solid #333; margin-bottom: 30px;
            font-family: monospace; font-size: 1.5em; color: #2ecc71;
        }
        .section-title {
            text-align: left; margin-top: 40px; margin-bottom: 15px;
            font-size: 1.2em; color: #888; text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .store-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;
        }
        .item-card {
            background: #111; border: 1px solid #333; border-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; align-items: center;
            transition: 0.2s; position: relative;
        }
        .item-preview {
            width: 60px; height: 60px; border-radius: 10px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .item-name { font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        .item-desc { font-size: 0.7em; color: #666; margin-bottom: 10px; min-height: 30px; }
        .item-price { color: #f1c40f; font-size: 0.9em; margin-bottom: 10px; }
        
        .btn-action {
            background: #2ecc71; color: #000; border: none; padding: 8px 0;
            width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        .btn-action.owned { background: #3498db; color: #fff; }
        .btn-action.active { background: #555; color: #aaa; cursor: default; }
        .btn-action.locked { background: #333; color: #555; cursor: not-allowed; }

        .back-btn {
            display: block; margin: 40px auto; padding: 15px 30px;
            background: transparent; border: 1px solid #fff; color: #fff;
            text-decoration: none; border-radius: 50px; width: 200px;
        }

        /* --- OPTIMISATION MOBILE --- */
        @media (max-width: 600px) {
            body { 
                padding: 10px; /* On perd moins de place sur les bords */
            }
            h1 { font-size: 1.8em; }
            
            .store-grid {
                /* FORCE 2 COLONNES SUR MOBILE (Plus compact) */
                grid-template-columns: 1fr 1fr !important;
                gap: 8px; /* Espace plus petit entre les cartes */
            }
            
            .item-card {
                padding: 10px; /* Cartes plus compactes */
            }
            
            .item-preview {
                width: 50px; height: 50px; font-size: 24px; margin-bottom: 5px;
            }
            
            .item-name { 
                font-size: 0.8em; 
                height: 2.2em; /* Force 2 lignes max pour aligner */
                overflow: hidden;
                display: flex; align-items: center; justify-content: center;
            }
            
            .item-desc {
                display: none; /* ASTUCE : On cache la description sur mobile pour gagner de la place */
            }
            
            .btn-action {
                font-size: 0.8em; padding: 6px 0;
            }
            
            .wallet-box {
                font-size: 1.2em; padding: 8px 15px; margin-bottom: 20px;
            }
        }

        
    </style>
</head>
<body>

    <h1>BOUTIQUE VIP</h1>
    <div class="wallet-box" id="wallet-display">Chargement...</div>

    <div class="section-title">🎨 AMBIANCES VISUELLES</div>
    <div class="store-grid" id="skin-grid"></div>

    <div class="section-title">🐕 MEUTES DE COMBAT</div>
    <div class="store-grid" id="dog-grid"></div>

    <a href="index.html" class="back-btn">RETOUR ACCUEIL</a>

   <script src="catalog.js?v=FINAL"></script>
    <script>
        // 1. Initialisation
        const walletEl = document.getElementById('wallet-amount');
        const gridEl = document.getElementById('store-grid');

        // On charge l'argent
        function getWallet() {
            return parseInt(localStorage.getItem('topdog_wallet')) || 0;
        }

        // On charge les inventaires
        function getInventory(type) {
            return JSON.parse(localStorage.getItem('topdog_inventory_' + type) || '[]');
        }

        // 2. Affichage
        function renderStore() {
            // Affiche l'argent
            const money = getWallet();
            // Formattage propre (1G, 100M...)
            let displayMoney = money;
            if (money >= 1000000000) displayMoney = (money / 1000000000).toFixed(1).replace(/\.0$/, '') + 'G';
            else if (money >= 1000000) displayMoney = (money / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            else if (money >= 1000) displayMoney = (money / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            
            walletEl.innerText = displayMoney + " $";

            gridEl.innerHTML = '';

            // On fusionne tout (Skins + Chiens) pour l'affichage
            const allItems = [
                ...CATALOG.skins.map(i => ({...i, type: 'skin'})),
                ...CATALOG.dogs.map(i => ({...i, type: 'dog'}))
            ];

            // On filtre les items par défaut (prix 0) car on les a déjà
            const shopItems = allItems.filter(i => i.price > 0);

            shopItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                // On vérifie si on le possède déjà
                const inventory = getInventory(item.type);
                const isOwned = inventory.includes(item.id);
                
                // On vérifie si c'est celui équipé actuellement
                const activeId = localStorage.getItem('topdog_active_' + (item.type === 'skin' ? 'bg' : 'dog'));
                const isEquipped = activeId === item.id;

                // Visuel de l'item (Couleur ou Emoji)
                let visual = '';
                if(item.type === 'skin') {
                    visual = `<div class="item-preview" style="background:${item.color}; border-radius:50%;"></div>`;
                } else {
                    visual = `<div class="item-preview" style="background:transparent; font-size:40px;">${item.emoji}</div>`;
                }

                // Bouton (Logique différente selon état)
                let btnHtml = '';
                if (isEquipped) {
                    btnHtml = `<button class="btn-action btn-equipped" disabled>ÉQUIPÉ</button>`;
                } else if (isOwned) {
                    btnHtml = `<button class="btn-action btn-owned" onclick="equipItem('${item.type}', '${item.id}')">ÉQUIPER</button>`;
                } else {
                    // Vérif argent pour couleur bouton
                    const canBuy = money >= item.price;
                    const btnClass = canBuy ? 'btn-buy' : 'btn-locked';
                    // Formattage prix bouton
                    let priceText = item.price >= 1000000 ? (item.price/1000000) + 'M' : item.price;
                    if(item.price >= 1000000000) priceText = (item.price/1000000000) + 'G';
                    
                    btnHtml = `<button class="btn-action ${btnClass}" onclick="buyItem('${item.type}', '${item.id}')">ACHETER ${priceText} $</button>`;
                }

                card.innerHTML = `
                    ${visual}
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.desc}</div>
                    ${btnHtml}
                `;
                gridEl.appendChild(card);
            });
        }

        // 3. ACHAT INSTANTANÉ (Sans confirmation)
        window.buyItem = function(type, id) {
            const list = type === 'skin' ? CATALOG.skins : CATALOG.dogs;
            const item = list.find(i => i.id === id);
            const currentMoney = getWallet();

            if (currentMoney >= item.price) {
                // A. PAIEMENT
                localStorage.setItem('topdog_wallet', currentMoney - item.price);

                // B. LIVRAISON
                let inventory = getInventory(type);
                inventory.push(id);
                localStorage.setItem('topdog_inventory_' + type, JSON.stringify(inventory));

                // C. UPDATE UI INSTANTANÉ
                renderStore(); 
                
                // Petit retour visuel (Optionnel, juste pour dire que ça a marché)
                // On pourrait faire vibrer le téléphone ici si on voulait
                
            } else {
                alert("Fonds insuffisants ! Continue à jouer !");
            }
        };

        // 4. ÉQUIPEMENT
        window.equipItem = function(type, id) {
            if (type === 'skin') {
                localStorage.setItem('topdog_active_bg', id);
            } else {
                localStorage.setItem('topdog_active_dog', id);
            }
            renderStore(); // Met à jour les boutons
        };

        // Lancement
        renderStore();
    </script>
</body>
</html>
