<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TOPDOG</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css?v=24"> 
    <link rel="icon" type="image/png" href="./icon-dog-192.png">
    <link rel="apple-touch-icon" href="./icon-dog-192.png">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #050505; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .logo-title {
            font-size: 3em; font-weight: 900; font-style: italic;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; letter-spacing: 4px;
        }
        .btn-start {
            background: #e67e22; color: #fff; border: none;
            padding: 15px 40px; font-size: 1.5em; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="logo-title">TOPDOG</div>
        <div style="color:#666; margin-bottom:30px; font-family:monospace;">V1.0 - GOLD EDITION</div>
        <button class="btn-start" onclick="launchApp()">JOUER</button>
    </div>

    <div class="top-bar">
        <h1>TOPDOG</h1>
        <div class="header-buttons">
            <button class="btn-circle" id="btn-sound">🔊</button>
            <button class="btn-circle" id="btn-rules">?</button>
        </div>
    </div>

    <div id="betting-board"></div>

    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">RÉSERVE</span>
            <span id="reserve-count" class="hud-value">&infin;</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">TEMPS</span>
            <span id="timer-container" class="hud-value">02:00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">BANQUE</span>
            <span id="score-display" class="hud-value highlight">0</span>
        </div>
    </div>

    <div class="game-container">
        <div id="game-grid"></div>
        <div id="message-overlay"></div>
    </div>

    <div class="controls">
        <button id="btn-hint">INDICE</button>
        <button id="btn-shuffle">BRASSER (<span id="shuffle-count">1</span>)</button>
        <button id="btn-reset">RESET</button>
    </div>

    <script>
        function launchApp() {
            document.getElementById('start-screen').style.display = 'none';
            if(window.audioCtx && window.audioCtx.state === 'suspended') {
                window.audioCtx.resume();
            }
            if(typeof startGame === 'function') {
                startGame();
            }
        }
    </script>

<script>
        (function applySkin() {
            // 1. On récupère le décor actif
            const activeBg = localStorage.getItem('topdog_active_bg') || 'bg_default';
            const body = document.body;

            // 2. On applique le style selon l'ID
            switch(activeBg) {
                case 'bg_night': // MODE NÉON
                    body.style.background = "linear-gradient(135deg, #0f0c29, #302b63, #24243e)";
                    document.documentElement.style.setProperty('--cyan', '#ff00ff'); // Change le bleu en rose néon
                    break;
                
                case 'bg_cyber': // MODE MATRIX
                    body.style.background = "#000";
                    body.style.backgroundImage = "linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px)";
                    body.style.backgroundSize = "20px 20px";
                    document.documentElement.style.setProperty('--cyan', '#00ff00'); // Tout devient vert hacker
                    break;

                case 'bg_gold': // MODE MILLIARDAIRE
                    body.style.background = "radial-gradient(circle, #44370b 0%, #1a1600 100%)";
                    document.documentElement.style.setProperty('--cyan', '#ffd700'); // Tout devient or
                    break;
                
                case 'bg_diamond': // MODE DIAMANT (1 MILLIARD)
                    body.style.background = "linear-gradient(to right, #e0eafc, #cfdef3)";
                    body.style.color = "#333"; // Texte foncé pour lisibilité
                    document.documentElement.style.setProperty('--bg', '#fff'); 
                    document.documentElement.style.setProperty('--cyan', '#0072ff');
                    break;

                default: // ORIGINAL (Rien à faire)
                    break;
            }
        })();
    </script>
    
    <script src="logic.js?v=23"></script> <script src="ui.js?v=25"></script>    </body>
</html>
