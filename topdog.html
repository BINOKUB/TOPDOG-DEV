<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TOPDOG</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css?v=24"> 
    <link rel="icon" type="image/png" href="./icon-dog-192.png">
    <link rel="apple-touch-icon" href="./icon-dog-192.png">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* FIX: On force le corps à prendre toute la hauteur pour voir le fond */
        body { 
            overscroll-behavior: none; 
            -webkit-user-select: none; user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            min-height: 100vh; /* IMPORTANT POUR LE FOND */
            margin: 0;
            transition: background 0.5s ease;
        }

        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #050505; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .logo-title {
            font-size: 3em; font-weight: 900; font-style: italic;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; letter-spacing: 4px;
        }
        .btn-start {
            background: #e67e22; color: #fff; border: none;
            padding: 15px 40px; font-size: 1.5em; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="logo-title">TOPDOG</div>
        <div style="color:#666; margin-bottom:30px; font-family:monospace;">V1.0 - GOLD EDITION</div>
        <button class="btn-start" onclick="launchApp()">JOUER</button>
    </div>

    <div class="top-bar">
        <h1>TOPDOG</h1>
        <div class="header-buttons">
            <button class="btn-circle" id="btn-sound">🔊</button>
            <button class="btn-circle" id="btn-rules">?</button>
        </div>
    </div>

    <div id="betting-board"></div>

    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">RÉSERVE</span>
            <span id="reserve-count" class="hud-value skin-text">&infin;</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">TEMPS</span>
            <span id="timer-container" class="hud-value">02:00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">BANQUE</span>
            <span id="score-display" class="hud-value highlight">0</span>
        </div>
    </div>

    <div class="game-container">
        <div id="game-grid"></div>
        <div id="message-overlay"></div>
    </div>

    <div class="controls">
        <button id="btn-hint">INDICE</button>
        <button id="btn-shuffle">BRASSER (<span id="shuffle-count">1</span>)</button>
        <button id="btn-reset">RESET</button>
    </div>

    <script>
        function launchApp() {
            document.getElementById('start-screen').style.display = 'none';
            if(window.audioCtx && window.audioCtx.state === 'suspended') {
                window.audioCtx.resume();
            }
            if(typeof startGame === 'function') {
                startGame();
            }
        }
    </script>

    <script>
        (function applySkin() {
            const activeBg = localStorage.getItem('topdog_active_bg') || 'bg_default';
            const body = document.body;
            const startScreen = document.getElementById('start-screen');
            const styleSheet = document.createElement("style");

            // Fonction pour injecter du CSS forcé (!important)
            function injectCSS(css) {
                styleSheet.innerText = css;
                document.head.appendChild(styleSheet);
            }

            switch(activeBg) {
                case 'bg_night': // MODE NÉON (Le fameux)
                    const neonBg = "linear-gradient(135deg, #2b1055, #7597de)"; // Plus clair pour être visible
                    body.style.background = neonBg;
                    if(startScreen) startScreen.style.background = neonBg;
                    
                    // ON FORCE LES COULEURS AVEC DU CSS DYNAMIQUE
                    injectCSS(`
                        :root { --cyan: #ff00ff !important; } /* Change la variable globale */
                        .skin-text { color: #ff00ff !important; text-shadow: 0 0 10px #ff00ff; }
                        #game-grid { 
                            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3); 
                            border: 1px solid rgba(255,0,255,0.3);
                        }
                        .tile { border-color: rgba(255,0,255,0.2) !important; }
                        .btn-circle { border-color: #ff00ff !important; color: #ff00ff !important; }
                        .top-bar h1 { text-shadow: 0 0 15px #ff00ff; }
                    `);
                    break;
                
                case 'bg_cyber': // MODE MATRIX
                    body.style.background = "#000";
                    const matrixBg = "linear-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 0, 0.1) 1px, transparent 1px)";
                    body.style.backgroundImage = matrixBg;
                    body.style.backgroundSize = "20px 20px";
                    
                    if(startScreen) {
                        startScreen.style.background = "#000";
                        startScreen.style.backgroundImage = matrixBg;
                        startScreen.style.backgroundSize = "20px 20px";
                    }

                    injectCSS(`
                        :root { --cyan: #00ff00 !important; }
                        .skin-text { color: #00ff00 !important; text-shadow: 0 0 10px #00ff00; }
                        #game-grid { box-shadow: 0 0 30px rgba(0, 255, 0, 0.2); border: 1px solid #00ff00; }
                        .tile { border-color: #004400 !important; font-family: 'Courier New', monospace; }
                        .dog-badge { background: #00ff00 !important; color: #000 !important; }
                    `);
                    break;

                case 'bg_gold': // MODE MILLIARDAIRE
                    const goldBg = "radial-gradient(circle, #6d5612 0%, #1a1600 100%)";
                    body.style.background = goldBg;
                    if(startScreen) startScreen.style.background = goldBg;
                    
                    injectCSS(`
                        :root { --cyan: #ffd700 !important; }
                        .skin-text { color: #ffd700 !important; }
                        #game-grid { border: 2px solid #ffd700; box-shadow: 0 0 50px rgba(255, 215, 0, 0.4); }
                        .tile { border: 1px solid rgba(255, 215, 0, 0.3) !important; }
                    `);
                    break;
                
                case 'bg_diamond': // MODE DIAMANT
                    const diamondBg = "linear-gradient(to right, #e0eafc, #cfdef3)";
                    body.style.background = diamondBg;
                    body.style.color = "#333";
                    
                    if(startScreen) {
                        startScreen.style.background = diamondBg;
                        // On force le titre en noir
                        const title = startScreen.querySelector('.logo-title');
                        if(title) {
                            title.style.webkitTextFillColor = "#333"; 
                            title.style.background = "none";
                        }
                    }

                    injectCSS(`
                        :root { --cyan: #0072ff !important; --bg: #fff !important; }
                        body { color: #333 !important; }
                        .skin-text { color: #0072ff !important; }
                        .tile { background: rgba(255,255,255,0.8) !important; border: 1px solid #ccc !important; color: #000 !important; }
                        .tile.empty { background: rgba(255,255,255,0.3) !important; }
                        h1 { text-shadow: none !important; color: #333 !important; -webkit-text-fill-color: #333 !important; }
                    `);
                    break;
            }
        })();
    </script>

    <script src="logic.js?v=25"></script>
    <script src="ui.js?v=26"></script>
</body>
</html>
