<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPDOG - Accueil</title>
    
    <link rel="stylesheet" href="style.css?v=FINAL">
    
    <style>
        body {
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a, #000);
            height: 100vh; overflow: hidden;
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .logo-container {
            margin-bottom: 50px;
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        .main-title {
            font-size: 4em; font-weight: 900; font-style: italic;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 5px; margin: 0;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-family: monospace; color: #2ecc71; 
            font-size: 1.2em; letter-spacing: 2px;
            margin-top: 10px;
        }

        /* LES GROS BOUTONS DU MENU */
        .menu-btn {
            display: block; width: 280px; text-decoration: none;
            text-align: center; padding: 20px 0; margin: 15px 0;
            border-radius: 50px; font-weight: 900; font-size: 1.5em;
            text-transform: uppercase; letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative; overflow: hidden;
        }

        /* Bouton JOUER (Orange/Gold - Action Principale) */
        .btn-play {
            background: linear-gradient(90deg, #e67e22, #d35400);
            color: #fff;
            box-shadow: 0 10px 30px rgba(230, 126, 34, 0.4);
            border: 2px solid #e67e22;
        }
        .btn-play:active { transform: scale(0.95); }

        /* Bouton DÉMO (Bleu Néon - Action Secondaire) */
        .btn-demo {
            background: transparent;
            color: #00f3ff;
            border: 3px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            font-size: 1.2em; /* Un peu plus petit */
        }
        .btn-demo:active { transform: scale(0.95); background: rgba(0, 243, 255, 0.1); }

        /* Animation flottante pour le logo */
        @keyframes float { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-20px); } 
            100% { transform: translateY(0px); } 
        }

        /* Version Mobile */
        @media (max-width: 600px) {
            .main-title { font-size: 3em; }
            .menu-btn { width: 80%; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <h1 class="main-title">TOPDOG</h1>
        <div class="subtitle">CASINO EDITION</div>
    </div>

    <a href="topdog.html" class="menu-btn btn-play">
        JOUER 🎲
    </a>

    <a href="demo.html" class="menu-btn btn-demo">
        DÉMO 🎓
    </a>
    
    <div style="margin-top: 30px;">
        <a href="store.html" style="color:#666; text-decoration:none; font-size:0.9em; border-bottom:1px dotted #666;">
            Accès Boutique VIP
        </a>
    </div>

    <script>
        document.addEventListener('click', function() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                ctx.resume();
            }
        });
    </script>

</body>
</html>
